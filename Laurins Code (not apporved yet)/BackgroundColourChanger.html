<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Menu</title>
    <style>
        /* Styling for the settings menu */
        #settingsMenu {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #f1f1f1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }
        /* Styling for the color options */
        .colorOption {
            width: 30px;
            height: 30px;
            margin: 5px;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: border-color 0.3s ease-in-out;
        }
        .colorOption.active {
            border-color: #333;
        }
    </style>
</head>
<body>

<div id="settingsMenu">
    <h2>Settings</h2>
    <div>
        <label for="backgroundColor">Background Color:</label>
        <div id="colorOptions">
            <div class="colorOption" style="background-color: #ffffff" data-color="#ffffff"></div>
            <div class="colorOption" style="background-color: #f0f0f0" data-color="#f0f0f0"></div>
            <div class="colorOption" style="background-color: #dcdcdc" data-color="#dcdcdc"></div>
            <div class="colorOption" style="background-color: #b0c4de" data-color="#b0c4de"></div>
            <div class="colorOption" style="background-color: #ffe4b5" data-color="#ffe4b5"></div>
        </div>
    </div>
</div>

<script src="BackgroundColourChanger.js"></script>
</body>
</html>
