<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>My Sphere</title>
  <link href="spherestyle2.css" rel="stylesheet" type="text/css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">

  <script type="module" src="sphere4.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <style>
    .button-block {
      margin-top: 7rem;
      z-index: 1;
    }

    .button-container {
      display: flex;
      align-items: center;
      margin-bottom: 10px; /* Add margin to separate each button-container */
    }

    .button-container button {
      margin-right: 10px; /* Add margin to separate button and h2 */
    }

    .button-container h2 {
      transition: opacity 0.5s ease-in-out; /* Add a transition for smooth fading */
      opacity: 0; /* Set text to be invisible by default */
    }

    /* Define animation keyframes */
    @keyframes fadeInOut {
      0% {
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <a href="mySpheres1.html">
    <img class="back-button" src="double-arrow-left.png">
  </a>
  <div class="container">
    <a>NAME: <span id="name"></span></a>
    <a>COLOR: <span><input type='color' id='color' disabled><span></a>
  </div>
  <div class="container">                                                                                                                       
    <h1 id="incrementable">L</h1>
    <div class="circle" id="sphere">
      <div class="wave"></div>
    </div>

    <div class="button-block">
      <div class="button-container">
        <button class="button-block-button-0" id="sbmtBtn1"></button>
        <h2 id="meaning1">+1 Variable</h2>
      </div>
      
      <div class="button-container">
        <button class="button-block-button-1" id="sbmtBtn2"></button>
        <h2 id="meaning2">+1 Variable</h2>
      </div>
    
      <div class="button-container">
        <button class="button-block-button-2" id="sbmtBtn3"></button>
        <h2 id="meaning3">+1 Variable</h2>
      </div>
    
      <div class="button-container">
        <button class="button-block-button-3" id="sbmtBtn4"></button>
        <h2 id="meaning4">+1 Variable</h2>
      </div>
    </div>
  </div>
  <div class="tier">
    <h2 id="tier">Tier: </h2>
    <h2 id="till_next_tier">Until next tier: 10L</h2>
  </div>
</body>
</html>
