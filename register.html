    <style> 
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body{
      background: #e0f3ff;
      overflow: hidden;
    }
    ::selection{
      background: rgba(26,188,156,0.3);
    }
    .container{
      max-width: 440px;
      padding: 0 20px;
      margin: 170px auto;
    }
    .wrapper{
      width: 100%;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0px 4px 10px 1px rgba(0,0,0,0.1);
    }
    .wrapper .title{
      height: 90px;
      background: #0621f8;
      border-radius: 5px 5px 0 0;
      color: #fff;
      font-size: 30px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper form{
      padding: 30px 25px 25px 25px;
    }
    .wrapper form .row{
      height: 45px;
      margin-bottom: 15px;
      position: relative;
    }
    .wrapper form .row input{
      height: 100%;
      width: 100%;
      outline: none;
      padding-left: 60px;
      border-radius: 5px;
      border: 1px solid lightgrey;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    form .row input:focus{
      border-color: #0621f8;
      box-shadow: inset 0px 0px 2px 2px rgba(26,188,156,0.25);
    }
    form .row input::placeholder{
      color: #999;
    }
    .wrapper form .row i{
      position: absolute;
      width: 47px;
      height: 100%;
      color: #fff;
      font-size: 18px;
      background: #0621f8;
      border: 1px solid #0621f8;
      border-radius: 5px 0 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper form .pass{
      margin: -8px 0 20px 0;
    }
    .wrapper form .pass a{
      color: #4c86bd;
      font-size: 17px;
      text-decoration: none;
    }
    .wrapper form .pass a:hover{
      text-decoration: underline;
    }
    .wrapper form .button input{
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      padding-left: 0px;
      background: #0621f8;
      border: 1px solid #0621f8;
      cursor: pointer;
    }
    form .button input:hover{
      background: #0720df;
    }
    .wrapper form .signup-link{
      text-align: center;
      margin-top: 20px;
      font-size: 17px;
    }
    .wrapper form .signup-link a{
      color: #4c86bd;
      text-decoration: none;
    }
    form .signup-link a:hover{
      text-decoration: underline; 
    }
    </style>
    <div class="container">
      <div class="wrapper">
        <div class="title"><span>Create A Sphere Today</span></div>
        <form>
          <div class="row">
            <i class="fas fa-user"></i>
            <input id = "userEmail" name = "email" type="email" placeholder="Email" required>
          </div>
          <div class="row">
            <i class="fas fa-user"></i>
            <input id = "userName" name = "name" placeholder="Name" required>
          </div>   
          <div class="row">
            <i class="fas fa-lock"></i>
            <input id = "userPassword" name = "userPassword" type="password" placeholder="Password" required>
          </div>
          <div class="row button">
            <input type="submit" value="Register" id="submitBtn">
          </div>
          <div class="signup-link">Already a member? <a href="login.html">Login now</a></div>
        </form>
      </div>
    </div>
    
  </body>
