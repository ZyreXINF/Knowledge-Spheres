<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Login</title> 
    <link rel="stylesheet" href="registrationstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>

  </head>
  <body>
    <div class="container">
      <div class="wrapper">
        <div class="title"><span>Do we know you?</span></div>
        <form action="login-form.php" method="get">
          <div class="row">
            <i class="fas fa-user"></i>
            <input name ="email" type="email" placeholder="Email" required>
          </div>
          <div class="row">
            <i class="fas fa-lock"></i>
            <input name ="userPassword" type="password" placeholder="Password" required>
          </div>
          <div class="pass"><a href="#">Forgot password?</a></div>
          <div class="row button">
            <input type="submit" value="Login">
          </div>
          <div class="signup-link">Not a member yet? <a href="register2.html">Register now</a></div>
        </form>
      </div>
    </div>
  </body>
