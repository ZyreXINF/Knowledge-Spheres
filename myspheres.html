</head>

<body>
  <div class='container'>
    <nav id="nav-bar">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="profile.html">Profile</a>
      <a class="nav-link" href="myspheres.html">My Spheres</a>
      <a class="nav-link" href="about.html">About Us</a>
      <a class="nav-link" href="contact.html">Contact</a>
    </nav>
    <h1>My <span class="blue">Spheres</span></h1>
  </div>
    <form>
      <input type="text" name="text" id="txt" required maxlength=20 placeholder="Enter a name here :)">
      <button type="submit" class="btn-list"> 
        <a>+</a>
      </button>
    </form>
    <div class="list">
      <div class="wrapper">
        <ul>
        </ul>
      </div>
    </div>

  <script>
    var page_limit = 10
    var index = 0
    let page_amount = 0

    const input_text = document.querySelector("#txt");
    const button = document.querySelector(".btn-list");
    const list = document.querySelector(".list ul");

    button.addEventListener("click", (e)=> {
      if (input_text.value.replace(/(<([^>]+)>)/ig, '').replace(/ /g,'') != "") {
        if (page_amount < page_limit) {
          e.preventDefault();
          page_amount++;
    
          const new_li = document.createElement("li");
          input_text.value = input_text.value.replace(/(<([^>]+)>)/ig, "");

          // GENERATE A LINK BASED ON THE INDEX

          link = 
          'sphere' + index.toString() + '.html';

          index++;

          new_li.innerHTML = '<a href="' + link + '" target="_blank">' + input_text.value + '</a>';

          list.appendChild(new_li);

          const new_span = document.createElement("span");
          new_span.innerHTML = "X";
          new_span.addEventListener("click", ()=> {
            page_amount--;
            new_span.parentElement.style.opacity = 0;
            setTimeout(()=> {
              new_span.parentElement.remove();
            }, 500)
          })
          new_li.appendChild(new_span);
        }
        else {
          alert("Max amount of environments is " + page_limit + "!");
        }
      }
      input_text.value = "";
    });
  </script>
  <script src="script.js"></script>
</body>
