      #popup-container {

<div id="popup-container"> "Everything flows, and nothing abides, everything gives way, and nothing stays fixed."- Heraclitus </div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
      var popupContainer = document.getElementById('popup-container');

      // Shows popup
      popupContainer.style.display = 'block';

      // Sets timeout to hide the popup for however long u want it.
      setTimeout(function () {
          popupContainer.style.display = 'none';
      }, 35000); // 10000 milliseconds is 10 seconds btw
  });
